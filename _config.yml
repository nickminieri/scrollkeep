# Site kit (2026-11): meta description, Open Graph tags and a sitemap, built by GitHub Pages.
title: ScrollKeep
author: Nick Minieri
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Keep Google's ownership file out of the sitemap.
defaults:
  - scope:
      path: "google822ed68b96addce9.html"
    values:
      sitemap: false
